services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interviewprep
      POSTGRES_PASSWORD: interviewprep
      POSTGRES_DB: interviewprep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewprep -d interviewprep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
